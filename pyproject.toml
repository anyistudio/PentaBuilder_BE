[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentabuilder-be"
version = "0.1.0"
description = "Backend service for PentaBuilder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "boto3>=1.39.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "langgraph>=0.4.0,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "fuzzywuzzy>=0.18.0,<1.0.0",
    "python-levenshtein>=0.25.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[project.scripts]
pentabuilder-api = "app.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
